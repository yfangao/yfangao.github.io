<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yifan Gao | Academic Hub</title>
    <link rel="stylesheet" href="core/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <img id="js-avatar" src="" alt="Avatar" class="avatar">
            <h1 id="js-name" style="font-size: 24px; margin: 15px 0 5px;"></h1>
            <p id="js-subtitle" style="font-size: 14px; color: #888; text-align: center; margin-bottom: 20px;"></p>

            <div class="social-container" id="js-socials"></div>
        </aside>

        <main class="main-content">
            <div class="hero-banner"></div>

            <header class="top-bar">
                <div class="view-switcher">
                    <button class="switch-btn" id="btn-home" onclick="app.switchTab('home')">首页 / Resume</button>
                    <button class="switch-btn" id="btn-blog" onclick="app.switchTab('blog')">博文 / Blog</button>
                </div>
            </header>

            <div class="scroll-area">
                <div class="content-wrapper">
                    <div id="render-target"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="data.js"></script>
    <script src="core/main.js"></script>
</body>
</html>
