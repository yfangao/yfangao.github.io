<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>My Space</title>
    <link rel="stylesheet" href="core/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <img id="js-avatar" src="" alt="Avatar" class="avatar">
            <h2 id="js-name"></h2>
            <p id="js-subtitle"></p>
            <nav class="nav-menu" id="js-menu"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="view-switcher">
                    <button class="switch-btn active" onclick="app.switchTab('home')">首页</button>
                    <button class="switch-btn" onclick="app.switchTab('blog')">博文</button>
                </div>
            </header>
            <div class="scroll-area" id="render-target"></div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="core/main.js"></script>
</body>
</html>
